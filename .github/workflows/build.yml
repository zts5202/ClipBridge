name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: clipbridge-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ClipDock ${{ github.ref_name }}
          body: |
            ClipDock ${{ github.ref_name }}（剪贴坞）：在同一局域网里，把 Android 手机和 Windows 电脑的剪贴板、图片和文件接在一起。不需要账号，也不经过公网。

            - 产品更名为 ClipDock，中文界面、托盘和通知显示「剪贴坞」。配对协议和端口没有变
            - 从 v1.2.0、v1.2.1、v1.2.2 可以直接覆盖安装。Android 应用 ID 和签名未改，Windows 安装 ID 未改。从 v1.1.x 升级仍需先卸载旧版，因为 v1.1.0 和 v1.1.1 的调试证书每次构建都不同
            - 发现与配对：同网 UDP 发现，新设备双方确认，已配对设备可自动重连
            - USB 网络共享：电脑主动探测手机（常见 192.168.42.129）并主动连出；新设备仍需双方确认
            - Windows 使用贴边悬浮条和托盘。托盘中文仍按 UTF-16 显示
            - 已连接后不再循环提示已连接/已断开；心跳 5 秒、3 次未回应才断开，10 秒内恢复不弹通知
            - 屏幕边缘平时是一条半透明小条。鼠标靠近约 8 像素或悬停约 150 毫秒滑出面板，离开约 600 毫秒收回。收回只收起面板，不断开已连接的会话
            - 连接、断开和发送不再播放提示音。托盘里可以打开「提示音」，默认关闭
            - 面板和小条是半透明磨砂玻璃（Windows 11 用 Acrylic，Windows 10 退化为模糊），能透出壁纸
            - 深色模式下悬浮条文字跟随主题；界面字体增加微软雅黑回退，避免中文变成方块
            - 双向同步文字、图片（PNG/JPEG/WebP）和文件，带进度、校验和失败重试
            - 电脑接收可选「仅剪贴板」，或「写入剪贴板并自动粘贴」；自动粘贴失败时仍保留剪贴板并通知

            Android 的 APK 与 AAB 使用仓库内固定的旁加载证书（SHA-256 前缀 6628A3CA），不是每次变化的调试证书。这不是上架密钥；上架前请换成自己的签名。程序文件名仍是 clipbridge.exe，便于覆盖安装后开机自启继续指向同一个文件。
            真机 Wi-Fi、手机热点、记事本自动粘贴、Windows 托盘和 Android 前台服务仍需双机手测，步骤见 README 的手动测试清单。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows runner
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (!(Test-Path "$src/clipbridge.exe")) { throw "missing clipbridge.exe" }
          Compress-Archive -Path "$src/*" -DestinationPath "clipdock-windows-x64.zip" -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "missing ISCC.exe" }
          & $iscc "/DMyAppVersion=1.3.0" "windows\installer\clipbridge.iss"
          if (!(Test-Path "build\windows\installer\ClipDock-Setup.exe")) { throw "missing installer" }
      - uses: actions/upload-artifact@v4
        with:
          name: clipdock-windows-x64
          path: |
            clipdock-windows-x64.zip
            build/windows/installer/ClipDock-Setup.exe
          if-no-files-found: error
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ClipDock ${{ github.ref_name }}
          body: |
            ClipDock ${{ github.ref_name }}（剪贴坞）：在同一局域网里，把 Android 手机和 Windows 电脑的剪贴板、图片和文件接在一起。不需要账号，也不经过公网。

            - 产品更名为 ClipDock，中文界面、托盘和通知显示「剪贴坞」。配对协议和端口没有变
